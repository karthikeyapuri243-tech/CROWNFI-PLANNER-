name: Build KRAM Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - '.github/workflows/android-apk.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kram-android-debug-keystore-v1
      - name: Build web app
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Add Android exact-alarm permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'
          if permission not in content:
              if "<application" not in content:
                  raise SystemExit("AndroidManifest.xml has no application element")
              content = content.replace("<application", permission + "\n    <application", 1)
              manifest.write_text(content)
          PY
      - name: Sync native plugins and web assets
        run: npx cap sync android
      - name: Print Android signing fingerprints
        run: |
          cd android
          chmod +x gradlew
          ./gradlew signingReport
      - name: Build installable debug APK
        run: |
          cd android
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KRAM-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
