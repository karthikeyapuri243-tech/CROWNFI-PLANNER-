name: Build KRAM Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - '.github/workflows/android-apk.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Generate KRAM Android launcher icons
        run: |
          python3 -m pip install --quiet cairosvg
          mkdir -p resources
          python3 - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='public/kram-icon.svg', write_to='resources/icon.png', output_width=1024, output_height=1024)
          PY
          npx --yes @capacitor/assets generate --android
      - name: Add Android exact-alarm permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'
          if permission not in content:
              if "<application" not in content:
                  raise SystemExit("AndroidManifest.xml has no application element")
              content = content.replace("<application", permission + "\n    <application", 1)
              manifest.write_text(content)
          PY
      - name: Sync native plugins and web assets
        run: npx cap sync android
      - name: Restore stable Android debug signing key
        env:
          KRAM_DEBUG_KEYSTORE_BASE64: ${{ secrets.KRAM_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KRAM_DEBUG_KEYSTORE_BASE64" ]; then
            echo "Missing GitHub Actions secret: KRAM_DEBUG_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          echo "$KRAM_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KRAM-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
