name: Build KRAM Android APK

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional release version, for example 1.0.1. Leave empty for a test build.'
        required: false
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Refresh dependency lock for test builds
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_version == '' }}
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          npm audit fix --package-lock-only --ignore-scripts || echo "Some advisories remain; review the audit report."
      - name: Install locked dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Generate KRAM Android launcher icons
        run: |
          python3 -m pip install --quiet cairosvg
          mkdir -p resources
          python3 - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='public/kram-icon.svg', write_to='resources/icon.png', output_width=1024, output_height=1024)
          PY
          npx --yes @capacitor/assets generate --android
      - name: Add Android exact-alarm permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
              '    <uses-permission android:name="android.permission.VIBRATE" />',
          ]
          if "<application" not in content:
              raise SystemExit("AndroidManifest.xml has no application element")
          for permission in permissions:
              if permission not in content:
                  content = content.replace("<application", permission + "\n    <application", 1)
          # Resize the WebView for the soft keyboard rather than covering the form.
          import re
          activity = re.compile(r'<activity\b[^>]*\bandroid:name="[^"]*MainActivity"[^>]*>', re.S)
          def resize_activity(match):
              tag = match.group(0)
              if 'android:windowSoftInputMode=' in tag:
                  return re.sub(r'android:windowSoftInputMode="[^"]*"', 'android:windowSoftInputMode="adjustResize"', tag)
              return tag[:-1] + ' android:windowSoftInputMode="adjustResize">'
          content, count = activity.subn(resize_activity, content, count=1)
          if count != 1:
              raise SystemExit("Could not find MainActivity for keyboard resizing")
          manifest.write_text(content)
          PY
      - name: Sync native plugins and web assets
        run: npx cap sync android
      - name: Set Android version for a release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version != '' }}
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = os.environ["RELEASE_VERSION"].strip()
          match = re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version)
          if not match:
              raise SystemExit("Release version must use MAJOR.MINOR.PATCH format, for example 1.0.1")
          major, minor, patch = map(int, match.groups())
          version_code = major * 1000000 + minor * 1000 + patch
          gradle = Path("android/app/build.gradle")
          content = gradle.read_text()
          start = content.index("defaultConfig")
          end = content.index("\n    }", start)
          block = content[start:end]
          block, code_count = re.subn(r"versionCode\s+\d+", f"versionCode {version_code}", block, count=1)
          block, name_count = re.subn(r'versionName\s+"[^"]+"', f'versionName "{version}"', block, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not safely set Android versionCode/versionName in app/build.gradle")
          gradle.write_text(content[:start] + block + content[end:])
          Path("KRAM-RELEASE-VERSION").write_text(version + "\n")
          print(f"Configured KRAM {version} (versionCode {version_code})")
          PY
      - name: Restore stable Android debug signing key
        env:
          KRAM_DEBUG_KEYSTORE_BASE64: ${{ secrets.KRAM_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KRAM_DEBUG_KEYSTORE_BASE64" ]; then
            echo "Missing GitHub Actions secret: KRAM_DEBUG_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KRAM_DEBUG_KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Explicitly configure and verify stable APK signing
        run: |
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle = Path("android/app/build.gradle")
          content = gradle.read_text()
          if "kramStableDebug" not in content:
              content, count = re.subn(
                  r"(android\s*\{)",
                  r'''\1
              signingConfigs {
                  kramStableDebug {
                      storeFile file(System.getenv("HOME") + "/.android/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }''',
                  content,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Could not insert stable KRAM signing configuration")
          if not re.search(r"buildTypes\s*\{", content):
              raise SystemExit("Could not find Android buildTypes block")
          if not re.search(r"debug\s*\{[^}]*kramStableDebug", content, re.S):
              content, count = re.subn(
                  r"(buildTypes\s*\{)",
                  r"\1\n        debug {\n            signingConfig signingConfigs.kramStableDebug\n        }",
                  content,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Could not attach stable signing config to debug APK")
          gradle.write_text(content)
          print("KRAM debug APK is explicitly configured to use the restored stable keystore.")
          PY
      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Verify APK signature and inspect permissions
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump permissions "$APK" | tee apk-permissions.txt
          if grep -Fq 'android.permission.REQUEST_INSTALL_PACKAGES' apk-permissions.txt; then
            echo "Unexpected APK installer permission. Stop build."
            exit 1
          fi
          sha256sum "$APK"
      - name: Review production dependency advisories (release gate)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' || inputs.release_version == '' }}
      - name: Review full dependency tree
        run: npm audit --audit-level=high
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' || inputs.release_version == '' }}
      - name: Persist tested dependency lockfile
        if: ${{ github.event_name == 'push' }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile unchanged."
          else
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
              echo "Newer changes exist; do not modify main."
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Refresh KRAM dependency lock after test build"
            git push origin HEAD:main
          fi
      - name: Prepare versioned APK
        run: |
          if [ -f KRAM-RELEASE-VERSION ]; then
            VERSION="$(cat KRAM-RELEASE-VERSION)"
          else
            VERSION="test-${GITHUB_RUN_NUMBER}"
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "KRAM-${VERSION}.apk"
          echo "KRAM_APK_FILE=KRAM-${VERSION}.apk" >> "$GITHUB_ENV"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KRAM-Android-APK
          path: ${{ env.KRAM_APK_FILE }}
          if-no-files-found: error
      - name: Publish GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.release_version }}
          name: KRAM v${{ inputs.release_version }}
          target_commitish: ${{ github.sha }}
          files: ${{ env.KRAM_APK_FILE }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
